# =====================================================================
# This file is a recipe that GitHub follows automatically.
# "CI" = Continuous Integration: every time code changes, a robot
# checks it (type check, tests, build) so broken code gets caught
# BEFORE it reaches users.
#
# GitHub finds this file because it lives in .github/workflows/.
# Any .yml file in that folder becomes a "workflow".
#
# YAML rules: indentation matters (spaces, never tabs), "key: value"
# sets something, and "- " starts an item in a list.
# =====================================================================

# The name shown in the GitHub "Actions" tab and next to each commit
# (the green check or red X).
name: CI

# "on" = WHEN does this run? (the trigger)
on:
  # 1. When someone pushes commits straight to the main branch.
  push:
    branches:
      - main
      # Also run on the Laravel branch while we build it, so pushes
      # there get a green check or red X too.
      - laravel
  # 2. When someone opens or updates a pull request INTO main.
  #    This is the important one: it tests the code before it's merged,
  #    so reviewers see a green check (safe) or a red X (don't merge).
  pull_request:
    branches:
      - main

# What the robot is allowed to do with your repo.
# "contents: read" = it can read the code but can't change it.
# Giving a job only the access it needs is called "least privilege",
# a security best practice.
permissions:
  contents: read

# A workflow is made of one or more "jobs". Each job runs on its own
# fresh computer. This file has one job.
jobs:
  # "verify" is the job's ID (you pick it). Other jobs can refer to it,
  # e.g. a future "deploy" job could say "only run after verify passes".
  verify:
    # Friendly name shown in the GitHub UI.
    name: Verify

    # The computer this runs on: a brand-new Linux (Ubuntu) machine that
    # GitHub lends you for a few minutes and throws away afterward.
    # That's why every step below starts from nothing.
    runs-on: ubuntu-latest

    # Safety net: if something hangs, stop it after 10 minutes instead of
    # burning through your free minutes.
    timeout-minutes: 10

    # The steps run in order, top to bottom. If any step fails,
    # the job stops and you get a red X.
    steps:
      # Step 1: the new machine is empty, so first download your code onto it.
      # "uses:" means "run a ready-made action someone else wrote".
      # actions/checkout is GitHub's official one; @v7 pins the version.
      - name: Check out repository
        uses: actions/checkout@v7

      # ---------------- BACKEND: PHP (Laravel) ----------------

      # Step 2: install PHP. The fresh machine has no PHP, just as it had
      # no Node. 8.5 matches the version Homebrew installed on your Mac.
      # composer.json requires at least 8.3.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # Installs Composer too (PHP's version of npm).
          tools: composer

      # Step 3: BUILD CACHING for PHP. Same idea as "cache: npm" below:
      # save the vendor/ folder, labeled with a fingerprint of
      # composer.lock. Lock file unchanged = reuse it instead of
      # downloading Laravel and ~100 packages again.
      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      # Step 4: install PHP packages. Like npm ci, this installs EXACTLY
      # the versions in composer.lock. The flags mean: never stop to ask
      # questions, and download zip files (faster than cloning git repos).
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Step 5: Laravel reads settings from a .env file, which is never
      # committed (it holds secrets). Copy the safe template and create a
      # throwaway APP_KEY (Laravel's encryption secret) just for this run.
      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # ---------------- FRONTEND: TypeScript (Node) ----------------

      # Step 6: install Node.js. With Laravel, Node no longer runs the
      # server. It only type-checks and builds the TypeScript for browsers.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        # "with:" passes settings to the action.
        with:
          # Use Node 24, matching "engines" in package.json. Your Mac has 26,
          # but CI uses 24, so this is the version that counts.
          node-version: 24
          # BUILD CACHING (the CTO question!). Downloading packages is slow.
          # This saves npm's download cache between runs, labeled with a
          # fingerprint of package-lock.json. If the lock file hasn't changed,
          # GitHub restores the saved cache instead of downloading
          # everything from the internet again. Same idea as the S3 shelf.
          cache: npm

      # Step 7: install the project's JavaScript packages.
      # "run:" means "type this command in the terminal".
      # npm ci (not npm install) installs EXACTLY the versions in
      # package-lock.json, so CI tests the same thing every time.
      - name: Install dependencies
        run: npm ci

      # Step 8: check the frontend. "verify" in package.json runs two
      # commands in a row and stops at the first failure:
      #   npm run typecheck  -> are the TypeScript types correct?
      #   npm run build      -> does Vite compile the TS/CSS for browsers?
      - name: Verify frontend (TypeScript)
        run: npm run verify

      # ---------------- BACKEND TESTS ----------------

      # Step 9: run the Laravel tests in tests/ (health endpoint and home
      # page). This replaces the old "npm run test".
      # Every step passes = green check. Any one fails = red X.
      - name: Run backend tests (PHP)
        run: php artisan test
